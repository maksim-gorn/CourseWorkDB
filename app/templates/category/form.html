{% extends 'base.html' %}
{% block title %}{{ 'Редактировать' if category else 'Добавить' }} категорию{% endblock %}
{% block content %}
<h2>{{ 'Редактировать' if category else 'Добавить' }} категорию</h2>
<form method="post" class="row g-3 mt-2">
    <div class="col-md-6">
        <label class="form-label">Название</label>
        <input name="name" class="form-control" value="{{ category.name if category else '' }}" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Родительская категория</label>
        <select name="parent_category_id" class="form-select">
            <option value="">— нет —</option>
            {% for p in parents %}
            <option value="{{ p.id_category }}" {{ 'selected' if category and category.parent_category_id == p.id_category else '' }}>{{ p.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-12">
        <button class="btn btn-success">{{ 'Сохранить' if category else 'Создать' }}</button>
        <a href="{{ url_for('main.category_list') }}" class="btn btn-secondary">Отмена</a>
    </div>
</form>
{% endblock %}
