{% extends 'base.html' %}
{% block title %}Доп. опции — {{ appliance.name }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2><i class="bi bi-gear"></i> Доп. опции: {{ appliance.name }}</h2>
    <div>
        <a href="{{ url_for('main.appliance_list') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> к технике</a>
    </div>
</div>

<form method="post" action="{{ url_for('main.extra_option_add', id=appliance.id_model) }}" class="row g-2 mb-4">
    <div class="col-auto">
        <input name="option" class="form-control" placeholder="Новая опция" required>
    </div>
    <div class="col-auto">
        <button class="btn btn-success"><i class="bi bi-plus-lg"></i> Добавить</button>
    </div>
</form>

<table class="table table-striped align-middle">
<thead class="table-dark">
    <tr><th>Опция</th><th>Действия</th></tr>
</thead>
<tbody>
{% for opt in appliance.extra_options.all() %}
<tr>
    <td>{{ opt.option }}</td>
    <td>
        <form method="post" action="{{ url_for('main.extra_option_delete', id=appliance.id_model, option=opt.option) }}" class="d-inline" onsubmit="return confirm('Удалить опцию?')">
            <button class="btn btn-sm btn-danger"><i class="bi bi-trash"></i></button>
        </form>
    </td>
</tr>
{% endfor %}
</tbody>
</table>
{% endblock %}
