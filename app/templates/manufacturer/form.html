{% extends 'base.html' %}
{% block title %}{{ 'Редактировать' if manufacturer else 'Добавить' }} производителя{% endblock %}
{% block content %}
<h2>{{ 'Редактировать' if manufacturer else 'Добавить' }} производителя</h2>
<form method="post" class="row g-3 mt-2">
    <div class="col-md-6">
        <label class="form-label">Название</label>
        <input name="name" class="form-control" value="{{ manufacturer.name if manufacturer else '' }}" required>
    </div>
    <div class="col-md-6">
        <label class="form-label">Юридический адрес</label>
        <input name="legal_address" class="form-control" value="{{ manufacturer.legal_address if manufacturer else '' }}">
    </div>
    <div class="col-12">
        <button class="btn btn-success">{{ 'Сохранить' if manufacturer else 'Создать' }}</button>
        <a href="{{ url_for('main.manufacturer_list') }}" class="btn btn-secondary">Отмена</a>
    </div>
</form>
{% endblock %}
